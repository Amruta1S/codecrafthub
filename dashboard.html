<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraftHub Dashboard</title>
    <style>
        /* Base styles */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
            color: #111;
        }

        header {
            background-color: #8B5CF6; /* purple */
            color: white;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 1.8em;
        }

        main {
            max-width: 1000px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Form styles */
        form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        form input, form textarea, form select {
            width: 100%;
            padding: 8px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        /* Button classes */
        .btn-primary {
            background-color: #8B5CF6;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s ease;
        }

        .btn-primary:hover { opacity: 0.9; }

        .btn-success {
            background-color: #F59E0B;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-success:hover { opacity: 0.9; }

        .btn-danger {
            background-color: #EF4444;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-danger:hover { opacity: 0.9; }

        /* Message styles */
        #message {
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .success { background-color: #F59E0B; color: white; }
        .error { background-color: #EF4444; color: white; }

        /* Table/Card styles */
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        table th, table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        table th {
            background-color: #8B5CF6;
            color: white;
        }

        /* Loader */
        #loader {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            table, tbody, th, td, tr {
                display: block;
            }
            table th { display: none; }
            table td {
                display: flex;
                justify-content: space-between;
                padding: 8px 12px;
                border-bottom: 1px solid #ddd;
            }
            table td::before {
                content: attr(data-label);
                font-weight: bold;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>CodeCraftHub: Your Learning Management Platform</h1>
</header>

<main>
    <div id="message"></div>
    <form id="courseForm">
        <input type="hidden" id="courseId" value="">
        <label>Name *</label>
        <input type="text" id="name" required placeholder="Course name">
        <label>Description *</label>
        <textarea id="description" required placeholder="Course description"></textarea>
        <label>Target Completion Date *</label>
        <input type="date" id="target_date" required>
        <label>Status *</label>
        <select id="status" required>
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
        </select>
        <button type="submit" class="btn-primary">Save Course</button>
    </form>

    <div id="loader">Loading...</div>

    <table id="coursesTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Target Date</th>
                <th>Status</th>
                <th>Created At</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</main>

<script>
const API_URL = '[YOUR_BACKEND_URL]/api/courses'; // Replace with your backend URL

const courseForm = document.getElementById('courseForm');
const coursesTableBody = document.querySelector('#coursesTable tbody');
const messageDiv = document.getElementById('message');
const loader = document.getElementById('loader');

function showMessage(msg, type='success') {
    messageDiv.textContent = msg;
    messageDiv.className = type === 'success' ? 'success' : 'error';
    messageDiv.style.display = 'block';
    setTimeout(() => { messageDiv.style.display = 'none'; }, 3000);
}

function showLoader(show=true) {
    loader.style.display = show ? 'block' : 'none';
}

async function fetchCourses() {
    showLoader(true);
    try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('Failed to fetch courses');
        const courses = await res.json();
        populateTable(courses);
    } catch (err) {
        showMessage(err.message, 'error');
    } finally {
        showLoader(false);
    }
}

function populateTable(courses) {
    coursesTableBody.innerHTML = '';
    courses.forEach(course => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td data-label="ID">${course.id}</td>
            <td data-label="Name">${course.name}</td>
            <td data-label="Description">${course.description}</td>
            <td data-label="Target Date">${course.target_date}</td>
            <td data-label="Status">${course.status}</td>
            <td data-label="Created At">${new Date(course.created_at).toLocaleString()}</td>
            <td data-label="Actions">
                <button class="btn-success" onclick="editCourse(${course.id})">Edit</button>
                <button class="btn-danger" onclick="deleteCourse(${course.id})">Remove</button>
            </td>
        `;
        coursesTableBody.appendChild(tr);
    });
}

courseForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = document.getElementById('courseId').value;
    const name = document.getElementById('name').value.trim();
    const description = document.getElementById('description').value.trim();
    const target_date = document.getElementById('target_date').value;
    const status = document.getElementById('status').value;

    if (!name || !description || !target_date || !status) {
        showMessage('Please fill all required fields', 'error');
        return;
    }

    const courseData = { name, description, target_date, status };
    showLoader(true);

    try {
        let res;
        if (id) {
            res = await fetch(`${API_URL}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(courseData)
            });
        } else {
            res = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(courseData)
            });
        }

        if (!res.ok) throw new Error('Failed to save course');
        showMessage(id ? 'Course updated successfully' : 'Course added successfully');
        courseForm.reset();
        document.getElementById('courseId').value = '';
        fetchCourses();
    } catch (err) {
        showMessage(err.message, 'error');
    } finally {
        showLoader(false);
    }
});

window.editCourse = async (id) => {
    showLoader(true);
    try {
        const res = await fetch(`${API_URL}/${id}`);
        if (!res.ok) throw new Error('Failed to fetch course');
        const course = await res.json();
        document.getElementById('courseId').value = course.id;
        document.getElementById('name').value = course.name;
        document.getElementById('description').value = course.description;
        document.getElementById('target_date').value = course.target_date;
        document.getElementById('status').value = course.status;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (err) {
        showMessage(err.message, 'error');
    } finally {
        showLoader(false);
    }
}

window.deleteCourse = async (id) => {
    if (!confirm('Are you sure you want to delete this course?')) return;
    showLoader(true);
    try {
        const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete course');
        showMessage('Course deleted successfully');
        fetchCourses();
    } catch (err) {
        showMessage(err.message, 'error');
    } finally {
        showLoader(false);
    }
}

// Initial load
fetchCourses();
</script>

</body>
</html>
